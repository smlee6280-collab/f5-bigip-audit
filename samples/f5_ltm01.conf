#TMSH-VERSION: 15.1.8
auth user admin {
    description "Admin User"
    encrypted-password $6$abcdEFGH$0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
    partition-access {
        all-partitions {
            role admin
        }
    }
    shell tmsh
}
auth user operator1 {
    description operator1
    encrypted-password $6$ijklMNOP$abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ
    partition-access {
        all-partitions {
            role admin
        }
    }
    shell none
}
auth user temp_vendor {
    description "vendor temporary"
    encrypted-password $6$qrstUVWX$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghij
    partition-access {
        all-partitions {
            role admin
        }
    }
    shell bash
}
sys global-settings {
    gui-setup disabled
    hostname ltm01.example.local
}
sys httpd {
    auth-pam-idle-timeout 3600
    ssl-protocol "all -SSLv2 -SSLv3"
}
sys sshd {
    allow { ALL }
}
sys ntp {
    timezone Asia/Seoul
}
sys snmp {
    agent-addresses { tcp6:161 udp6:161 }
    allowed-addresses { 0.0.0.0/0 }
    communities {
        /Common/comm-public {
            community-name public
            source default
            oid-subset .1
        }
    }
}
net vlan /Common/external {
    interfaces {
        1.1 { }
    }
    tag 4094
}
net vlan /Common/internal {
    interfaces {
        1.2 { }
    }
    tag 4093
}
net self /Common/self_external {
    address 203.0.113.20/24
    allow-service default
    traffic-group /Common/traffic-group-local-only
    vlan /Common/external
}
net self /Common/self_internal {
    address 10.30.0.2/24
    allow-service all
    traffic-group /Common/traffic-group-local-only
    vlan /Common/internal
}
ltm pool /Common/pool_web {
    members {
        /Common/10.30.0.11:80 {
            address 10.30.0.11
        }
        /Common/10.30.0.12:80 {
            address 10.30.0.12
        }
    }
    monitor /Common/http
}
ltm pool /Common/pool_old_app {
    monitor /Common/tcp
}
ltm rule /Common/irule_xff {
    when HTTP_REQUEST {
        HTTP::header insert X-Forwarded-For [IP::remote_addr]
        if { [HTTP::uri] starts_with "/admin" } { reject }
    }
}
ltm virtual /Common/vs_web_443 {
    destination /Common/203.0.113.30:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_web
    profiles {
        /Common/clientssl {
            context clientside
        }
        /Common/http { }
        /Common/tcp { }
    }
    rules {
        /Common/irule_xff
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
}
ltm virtual /Common/vs_legacy_8080 {
    destination /Common/203.0.113.31:8080
    disabled
    ip-protocol tcp
    mask 255.255.255.255
    profiles {
        /Common/tcp { }
    }
    source 0.0.0.0/0
}
ltm virtual /Common/vs_any_port {
    destination /Common/203.0.113.32:0
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_web
    profiles {
        /Common/fastL4 { }
    }
    source 0.0.0.0/0
}
ltm nat /Common/nat_mgmt_server {
    originating-address 10.30.0.99
    translation-address 203.0.113.99
}
