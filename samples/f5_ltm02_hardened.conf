#TMSH-VERSION: 17.1.2
auth password-policy {
    expiration-warning 7
    max-duration 90
    max-login-failures 5
    lockout-duration 300
    minimum-length 10
    password-memory 3
    policy-enforcement enabled
    required-lowercase 1
    required-numeric 1
    required-special 1
    required-uppercase 1
}
auth user secadm01 {
    description "보안관리자"
    encrypted-password $6$abcdEFGH$0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
    partition-access {
        all-partitions {
            role admin
        }
    }
    shell tmsh
}
auth user audit-lee {
    description "감사 조회"
    encrypted-password $6$ijklMNOP$abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ
    partition-access {
        all-partitions {
            role auditor
        }
    }
    shell none
}
sys db systemauth.primaryadminuser {
    value "secadm01"
}
sys db systemauth.disablerootlogin {
    value "true"
}
sys global-settings {
    gui-setup disabled
    hostname ltm02.example.local
}
sys httpd {
    allow { 10.99.0.0/255.255.255.0 }
    auth-pam-idle-timeout 600
    ssl-protocol "all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1"
}
sys sshd {
    allow { 10.99.0.0/255.255.255.0 }
    inactivity-timeout 600
}
sys ntp {
    servers { 10.99.0.123 }
    timezone Asia/Seoul
}
sys syslog {
    remote-servers {
        /Common/siem01 {
            host 10.99.0.50
            remote-port 514
        }
    }
}
sys snmp {
    agent-addresses { tcp6:161 udp6:161 }
    allowed-addresses { 10.99.0.40 }
    communities {
        /Common/nms_ro {
            community-name "Nms#Ltm02-Ro!2026"
            source 10.99.0.40
            oid-subset .1
        }
    }
    traps {
        /Common/nms_trap {
            community "Nms#Ltm02-Tr!2026"
            host 10.99.0.40
            version 2c
        }
    }
}
sys icall script /Common/ucs_backup {
    app-service none
    definition {
        set dt [clock format [clock seconds] -format {%Y%m%d}]
        tmsh::run_proc { save sys ucs /var/local/ucs/auto_$dt.ucs }
        exec tmsh save sys ucs /var/local/ucs/auto_$dt.ucs
    }
    description none
    events none
}
sys icall handler periodic /Common/ucs_backup_daily {
    interval 86400
    script /Common/ucs_backup
}
net vlan /Common/external {
    interfaces {
        1.1 { }
    }
    tag 4094
}
net vlan /Common/internal {
    interfaces {
        1.2 { }
    }
    tag 4093
}
net self /Common/self_external {
    address 198.51.100.20/24
    allow-service none
    traffic-group /Common/traffic-group-local-only
    vlan /Common/external
}
net self /Common/self_internal_ha {
    address 10.40.0.2/24
    allow-service {
        udp:1026
        tcp:4353
    }
    traffic-group /Common/traffic-group-local-only
    vlan /Common/internal
}
security dos profile /Common/dos_web {
    app-service none
}
ltm pool /Common/pool_web {
    members {
        /Common/10.40.0.11:443 {
            address 10.40.0.11
        }
    }
    monitor /Common/https
}
ltm virtual /Common/vs_web_443 {
    destination /Common/198.51.100.30:443
    ip-protocol tcp
    mask 255.255.255.255
    pool /Common/pool_web
    policies {
        /Common/asm_auto_l7_policy__vs_web_443 { }
    }
    profiles {
        /Common/clientssl {
            context clientside
        }
        /Common/dos_web { }
        /Common/http { }
        /Common/tcp { }
        /Common/websecurity { }
    }
    security-log-profiles {
        /Common/Log\ all\ requests
    }
    source 0.0.0.0/0
    source-address-translation {
        type automap
    }
}
